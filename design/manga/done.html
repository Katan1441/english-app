<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>จบบท</title>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;600&amp;family=Kanit:wght@700;800;900&amp;family=Lexend:wght@600;700&amp;family=Mali:wght@600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#000}a:hover{color:#444}
</style>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; color: #000000; font-family: Anuphan, 'Noto Sans Thai', sans-serif; display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 72px 22px 28px; background-color: #ffffff; background-image: radial-gradient(circle at 50% 33%, #ffffff 0, #ffffff 120px, rgba(255,255,255,0) 330px), repeating-conic-gradient(from 2deg at 50% 33%, #000000 0deg 1.3deg, #ffffff 1.3deg 6.5deg)">

<h1 style="margin: 0; font-family: Kanit, sans-serif; font-weight: 900; font-size: 64px; line-height: 1; transform: rotate(-5deg); text-shadow: 3px 0 #ffffff, -3px 0 #ffffff, 0 3px #ffffff, 0 -3px #ffffff, 2px 2px #ffffff, -2px -2px #ffffff, 2px -2px #ffffff, -2px 2px #ffffff">เยี่ยม!</h1>

<div style="position: relative; width: 220px; height: 220px; flex: none">
<svg width="220" height="220" viewBox="0 0 220 220" aria-hidden="true" style="position: absolute; inset: 0"><polygon points="110,10 128.6,40.5 160,23.4 160.9,59.1 196.6,60 179.5,91.4 210,110 179.5,128.6 196.6,160 160.9,160.9 160,196.6 128.6,179.5 110,210 91.4,179.5 60,196.6 59.1,160.9 23.4,160 40.5,128.6 10,110 40.5,91.4 23.4,60 59.1,59.1 60,23.4 91.4,40.5" fill="#ffffff" stroke="#000000" stroke-width="4" stroke-linejoin="round"></polygon></svg>
<div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1">
<span style="font-family: Kanit, sans-serif; font-weight: 900; font-size: 54px; font-variant-numeric: tabular-nums">+18</span>
<span style="font-family: Kanit, sans-serif; font-weight: 800; font-size: 20px; margin-top: 4px">XP</span>
</div>
</div>

<p style="margin: 0; background: #ffffff; border: 3px solid #000000; border-radius: 999px; padding: 6px 18px; font-family: Mali, sans-serif; font-weight: 700; font-size: 17px">จบบทแล้ว หน่วยที่ 3 เหลืออีก 4 วง</p>

<section aria-label="ผลของบทนี้" style="width: 100%; box-sizing: border-box; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: #ffffff; border: 3px solid #000000; box-shadow: 5px 5px 0 #000000; margin-top: 6px">
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 14px 4px">
<b style="font-family: Kanit, sans-serif; font-weight: 800; font-size: 28px; font-variant-numeric: tabular-nums">90%</b>
<span style="font-size: 13px; color: #3d3d3d">ความแม่น</span>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 14px 4px; border-left: 2px solid #000000">
<b style="font-family: Kanit, sans-serif; font-weight: 800; font-size: 28px; font-variant-numeric: tabular-nums">4:12</b>
<span style="font-size: 13px; color: #3d3d3d">เวลา</span>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 14px 4px; border-left: 2px solid #000000">
<b style="font-family: Kanit, sans-serif; font-weight: 800; font-size: 28px; font-variant-numeric: tabular-nums">7</b>
<span style="font-size: 13px; color: #3d3d3d">ถูกติดกันสูงสุด</span>
</div>
</section>

<div style="width: 100%; margin-top: auto; display: flex; flex-direction: column; gap: 12px">
<button type="button" style="height: 56px; border: 3px solid #000000; border-radius: 12px; background: #000000; color: #ffffff; font-family: Kanit, sans-serif; font-weight: 800; font-size: 20px; box-shadow: 0 5px 0 #5a5a5a; cursor: pointer">ต่อไป</button>
<button type="button" style="height: 52px; border: 3px solid #000000; border-radius: 12px; background: #ffffff; color: #000000; font-family: Anuphan, sans-serif; font-weight: 600; font-size: 17px; cursor: pointer">กลับเส้นทาง</button>
</div>

</div>
</body>
</html>
