<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>เส้นทาง</title>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;600&amp;family=Kanit:wght@700;800;900&amp;family=Lexend:wght@600;700&amp;family=Mali:wght@600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#000}a:hover{color:#444}
</style>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #ffffff; color: #000000; font-family: Anuphan, 'Noto Sans Thai', sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">

<header style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 18px 14px; border-bottom: 3px solid #000000">
<div style="display: flex; align-items: center; gap: 8px">
<svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c1 3.5 5 6 5 11a5 5 0 0 1-10 0c0-2.5 1.2-4 2.5-5.5C9.8 9.5 10.5 11 12 11.5 11.5 8.5 11 5 12 2z" fill="#000000" stroke="#000000" stroke-width="1.5" stroke-linejoin="round"></path><path d="M12 14.5c1 1 1.8 2 1.8 3a1.8 1.8 0 0 1-3.6 0c0-1 .8-2 1.8-3z" fill="#ffffff"></path></svg>
<span style="font-family: Kanit, sans-serif; font-weight: 800; font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums">12</span>
<span style="font-size: 13px; color: #4a4a4a; line-height: 1.2">วัน<br>ติดต่อกัน</span>
</div>
<div style="display: flex; align-items: center; gap: 8px">
<svg width="40" height="40" viewBox="0 0 40 40" role="img" aria-label="วันนี้ได้ 15 จาก 20 XP"><circle cx="20" cy="20" r="16" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="2 3"></circle><circle cx="20" cy="20" r="16" fill="none" stroke="#000000" stroke-width="5" stroke-dasharray="75.4 100.5" transform="rotate(-90 20 20)"></circle></svg>
<div style="line-height: 1.15"><b style="font-family: Kanit, sans-serif; font-weight: 800; font-size: 20px; font-variant-numeric: tabular-nums">15/20</b><br><span style="font-size: 12px; color: #4a4a4a">XP วันนี้</span></div>
</div>
<button type="button" aria-label="ตั้งค่า" style="width: 44px; height: 44px; border: 2.5px solid #000000; border-radius: 50%; background: #ffffff; display: grid; place-items: center; padding: 0; cursor: pointer">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3.4"></circle><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"></path></svg>
</button>
</header>

<section style="margin: 16px 16px 0; border: 3px solid #000000; box-shadow: 5px 5px 0 #000000; padding: 14px 14px 14px 16px; display: flex; align-items: center; gap: 12px; background-color: #ffffff; background-image: linear-gradient(105deg, #ffffff 0 58%, rgba(255,255,255,0) 58%), radial-gradient(#000000 1px, rgba(0,0,0,0) 1.3px); background-size: 100% 100%, 7px 7px">
<div style="display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0">
<div style="display: flex; align-items: center; gap: 8px">
<span style="background: #000000; color: #ffffff; font-family: Kanit, sans-serif; font-weight: 800; font-size: 14px; padding: 2px 8px; border-radius: 3px">A1</span>
<span style="font-size: 13px; color: #333333; font-weight: 600">หน่วยที่ 3</span>
</div>
<h2 style="margin: 0; font-family: Kanit, sans-serif; font-weight: 800; font-size: 26px; line-height: 1.1">บ้านและที่อยู่</h2>
</div>
<button type="button" style="background: #ffffff; border: 2.5px solid #000000; border-radius: 8px; padding: 8px 12px; min-height: 44px; font-family: Anuphan, sans-serif; font-weight: 600; font-size: 14px; color: #000000; cursor: pointer">คู่มือ</button>
</section>

<main style="flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 24px 0 0; overflow: hidden">

<button type="button" aria-label="ศัพท์ บ้าน ชุดที่ 2 ทำแล้ว" style="flex: none; width: 64px; height: 64px; border-radius: 50%; background: #000000; border: 3px solid #000000; box-shadow: 0 5px 0 #5a5a5a; display: grid; place-items: center; padding: 0; transform: translateX(-36px); cursor: pointer">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
</button>

<button type="button" aria-label="ไวยากรณ์ There is และ There are ทำแล้ว" style="flex: none; width: 64px; height: 64px; border-radius: 50%; background: #000000; border: 3px solid #000000; box-shadow: 0 5px 0 #5a5a5a; display: grid; place-items: center; padding: 0; transform: translateX(-62px); cursor: pointer">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
</button>

<div style="flex: none; position: relative; display: flex; flex-direction: column; align-items: center; transform: translateX(18px)">
<div style="position: relative; margin-bottom: 8px; background: #ffffff; border: 3px solid #000000; border-radius: 20px; padding: 4px 18px; font-family: Mali, sans-serif; font-weight: 700; font-size: 18px; line-height: 1.5">เริ่ม
<svg width="22" height="14" viewBox="0 0 22 14" aria-hidden="true" style="position: absolute; left: 50%; bottom: -13px; margin-left: -11px"><path d="M0 1 L11 13 L22 1" fill="#ffffff" stroke="#000000" stroke-width="3" stroke-linejoin="round"></path></svg>
</div>
<div style="width: 112px; height: 112px; border-radius: 50%; display: grid; place-items: center; background-image: radial-gradient(#000000 1.1px, rgba(0,0,0,0) 1.4px); background-size: 7px 7px">
<button type="button" aria-label="อ่าน-ฟัง เรื่องบ้านของพลอย วงถัดไป" style="width: 80px; height: 80px; border-radius: 50%; background: #ffffff; border: 4px solid #000000; box-shadow: 0 6px 0 #000000; display: grid; place-items: center; padding: 0; cursor: pointer">
<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h6a3 3 0 0 1 3 3v12a2.5 2.5 0 0 0-2.5-2.5H3zM21 5h-6a3 3 0 0 0-3 3v12a2.5 2.5 0 0 1 2.5-2.5H21z"></path></svg>
</button>
</div>
</div>

<button type="button" aria-label="พูดตามเรื่อง ยังไม่ถึง" style="flex: none; width: 64px; height: 64px; border-radius: 50%; background: #ffffff; border: 3px dashed #000000; display: grid; place-items: center; padding: 0; transform: translateX(58px); cursor: pointer">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#4a4a4a" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>
</button>

<button type="button" aria-label="ศัพท์ บ้าน ชุดที่ 3 ยังไม่ถึง" style="flex: none; width: 64px; height: 64px; border-radius: 50%; background: #ffffff; border: 3px dashed #000000; display: grid; place-items: center; padding: 0; transform: translateX(30px); cursor: pointer">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#4a4a4a" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="13" height="13" rx="2"></rect><path d="M8 4h11a2 2 0 0 1 2 2v11"></path></svg>
</button>

<button type="button" aria-label="ด่านทดสอบท้ายหน่วยที่ 3" style="flex: none; width: 68px; height: 68px; border-radius: 50%; border: 3px solid #000000; display: grid; place-items: center; padding: 0; transform: translateX(-20px); cursor: pointer; background-color: #ffffff; background-image: repeating-linear-gradient(45deg, #000000 0 1.5px, rgba(0,0,0,0) 1.5px 6px)">
<span style="width: 44px; height: 44px; border-radius: 50%; background: #ffffff; border: 2.5px solid #000000; display: grid; place-items: center">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8.5 20h7M10 17h4"></path></svg>
</span>
</button>

</main>

<nav aria-label="เมนูหลัก" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-top: 3px solid #000000; background: #ffffff">
<button type="button" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 9px 0 12px; border: 0; background: #000000; color: #ffffff; font-family: Anuphan, sans-serif; font-size: 12px; font-weight: 600; cursor: pointer">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M3 6.5l5.5-2 7 2 5.5-2v13l-5.5 2-7-2-5.5 2z"></path><path d="M8.5 4.5v13M15.5 6.5v13"></path></svg>เรียน</button>
<button type="button" style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 9px 0 12px; border: 0; background: #ffffff; color: #000000; font-family: Anuphan, sans-serif; font-size: 12px; font-weight: 600; cursor: pointer">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6.5 7v10M17.5 7v10M3.5 9.5v5M20.5 9.5v5M6.5 12h11"></path></svg>ฝึก</button>
<button type="button" style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 9px 0 12px; border: 0; background: #ffffff; color: #000000; font-family: Anuphan, sans-serif; font-size: 12px; font-weight: 600; cursor: pointer">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="13" height="13" rx="2"></rect><path d="M8 4h11a2 2 0 0 1 2 2v11"></path></svg>ศัพท์</button>
<button type="button" style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 9px 0 12px; border: 0; background: #ffffff; color: #000000; font-family: Anuphan, sans-serif; font-size: 12px; font-weight: 600; cursor: pointer">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="7" height="7"></rect><rect x="13" y="4" width="7" height="7"></rect><rect x="4" y="13" width="7" height="7"></rect><path d="M13 16.5h7M16.5 13v7"></path></svg>ไวยากรณ์</button>
<button type="button" style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 9px 0 12px; border: 0; background: #ffffff; color: #000000; font-family: Anuphan, sans-serif; font-size: 12px; font-weight: 600; cursor: pointer">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h6a3 3 0 0 1 3 3v12a2.5 2.5 0 0 0-2.5-2.5H3zM21 5h-6a3 3 0 0 0-3 3v12a2.5 2.5 0 0 1 2.5-2.5H21z"></path></svg>อ่าน-ฟัง</button>
</nav>

</div>
</body>
</html>
