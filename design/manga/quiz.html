<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>ตอบคำถาม</title>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;600&amp;family=Kanit:wght@700;800;900&amp;family=Lexend:wght@600;700&amp;family=Mali:wght@600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#000}a:hover{color:#444}
</style>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #ffffff; color: #000000; font-family: Anuphan, 'Noto Sans Thai', sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">

<header style="display: flex; align-items: center; gap: 12px; padding: 18px 16px 8px">
<button type="button" aria-label="ออกจากบทนี้" style="flex: none; width: 44px; height: 44px; border: 0; background: #ffffff; display: grid; place-items: center; padding: 0; cursor: pointer">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</button>
<div role="progressbar" aria-label="ข้อที่ 6 จาก 10" aria-valuenow="6" aria-valuemin="0" aria-valuemax="10" style="flex: 1; height: 20px; box-sizing: border-box; border: 3px solid #000000; border-radius: 12px; background: #ffffff; overflow: hidden">
<div style="width: 60%; height: 100%; box-sizing: border-box; border-right: 3px solid #000000; background-image: repeating-linear-gradient(-45deg, #000000 0 4px, #ffffff 4px 7px)"></div>
</div>
<span style="flex: none; font-family: Kanit, sans-serif; font-weight: 800; font-size: 15px; background: #000000; color: #ffffff; padding: 4px 10px; border-radius: 999px; transform: rotate(-4deg)">ติดกัน 5</span>
</header>

<section style="padding: 14px 20px 0; display: flex; flex-direction: column; gap: 10px">
<p style="margin: 0; font-size: 15px; color: #333333; font-weight: 600">เลือกคำแปลที่ถูก</p>
<div style="display: flex; align-items: center; gap: 14px">
<button type="button" aria-label="ฟังเสียงคำนี้" style="flex: none; width: 56px; height: 56px; border-radius: 50%; border: 3px solid #000000; background: #ffffff; box-shadow: 3px 3px 0 #000000; display: grid; place-items: center; padding: 0; cursor: pointer">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z" fill="#000000"></path><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"></path></svg>
</button>
<h1 style="margin: 0; font-family: Lexend, sans-serif; font-weight: 700; font-size: 44px; letter-spacing: -0.5px; line-height: 1.1">kitchen</h1>
</div>
<p style="margin: 0; font-size: 15px; color: #4a4a4a">อ่านว่า <b style="color: #000000">คิช</b>-เชิน</p>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-top: 12px">
<button type="button" style="min-height: 76px; border: 3px solid #8a8a8a; border-radius: 10px; background: #ffffff; font-family: Anuphan, sans-serif; font-weight: 600; font-size: 18px; color: #6b6b6b; cursor: pointer">ห้องนอน</button>
<button type="button" aria-label="ห้องครัว คำตอบที่ถูก" style="position: relative; min-height: 76px; border: 3px solid #000000; border-radius: 10px; background: #ffffff; box-shadow: 5px 5px 0 #000000; font-family: Anuphan, sans-serif; font-weight: 600; font-size: 19px; color: #000000; cursor: pointer">ห้องครัว
<svg width="120" height="76" viewBox="0 0 120 76" aria-hidden="true" style="position: absolute; left: 50%; top: 50%; margin: -38px 0 0 -60px; pointer-events: none"><path d="M88 12C72 2 34 2 17 17 3 30 9 56 38 65c28 8 63 1 70-17 6-15-6-28-30-33" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"></path></svg>
</button>
<button type="button" style="min-height: 76px; border: 3px solid #8a8a8a; border-radius: 10px; background: #ffffff; font-family: Anuphan, sans-serif; font-weight: 600; font-size: 18px; color: #6b6b6b; cursor: pointer">ห้องน้ำ</button>
<button type="button" style="min-height: 76px; border: 3px solid #8a8a8a; border-radius: 10px; background: #ffffff; font-family: Anuphan, sans-serif; font-weight: 600; font-size: 18px; color: #6b6b6b; cursor: pointer">สวน</button>
</div>
</section>

<section aria-live="polite" style="position: absolute; left: 0; right: 0; bottom: 0; background: #ffffff; border-top: 4px solid #000000; padding: 16px 18px 22px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 10px">
<svg width="38" height="38" viewBox="0 0 40 40" aria-hidden="true"><path d="M29 7C22 2 10 3 6 12c-4 9 1 20 13 22 11 2 19-4 19-13 0-6-4-10-11-11" fill="none" stroke="#000000" stroke-width="4.5" stroke-linecap="round"></path></svg>
<h2 style="margin: 0; font-family: Kanit, sans-serif; font-weight: 900; font-size: 30px; line-height: 1">ถูกต้อง!</h2>
<span style="margin-left: auto; font-family: Kanit, sans-serif; font-weight: 800; font-size: 16px; border: 2.5px solid #000000; border-radius: 999px; padding: 2px 10px">+1 XP</span>
</div>
<div style="display: flex; align-items: flex-end; gap: 14px">
<div style="flex: none; width: 76px; height: 76px; box-sizing: border-box; border: 3px solid #000000; border-radius: 50%; overflow: hidden; display: grid; place-items: end center; background-color: #ffffff; background-image: radial-gradient(#000000 1px, rgba(0,0,0,0) 1.3px); background-size: 6px 6px">
<svg width="70" height="70" viewBox="0 0 64 64" aria-hidden="true">
<path d="M10 64c2-8 10-12 22-12s20 4 22 12z" fill="#ffffff" stroke="#000000" stroke-width="2.4" stroke-linejoin="round"></path>
<ellipse cx="32" cy="35" rx="15" ry="16" fill="#ffffff" stroke="#000000" stroke-width="2.4"></ellipse>
<path d="M15 35C14 21 22 12 32 12s18 9 17 23l-3-2-2-8-5 5-3-8-4 7-4-7-3 8-5-5-2 8z" fill="#000000" stroke="#000000" stroke-width="1.5" stroke-linejoin="round"></path>
<path d="M15.5 32L12.5 47l6-3.5zM48.5 32l3 15-6-3.5z" fill="#000000"></path>
<ellipse cx="26" cy="37.5" rx="2.6" ry="3.8" fill="#000000"></ellipse>
<ellipse cx="38" cy="37.5" rx="2.6" ry="3.8" fill="#000000"></ellipse>
<circle cx="27" cy="36.2" r="1.05" fill="#ffffff"></circle>
<circle cx="39" cy="36.2" r="1.05" fill="#ffffff"></circle>
<path d="M29.3 44.2q2.7 2.4 5.4 0" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"></path>
<path d="M20 42.5l2-1.6M22.6 43l2-1.6M39.4 43l2-1.6M42 42.5l2-1.6" fill="none" stroke="#000000" stroke-width="1.2" stroke-linecap="round"></path>
</svg>
</div>
<div style="position: relative; flex: 1; min-width: 0; border: 3px solid #000000; border-radius: 22px; padding: 10px 14px; background: #ffffff; font-family: Mali, sans-serif; font-weight: 600; font-size: 16px; line-height: 1.5">
kitchen แปลว่า ห้องครัว<br>ถูกติดกัน 5 ข้อแล้ว เก่งมาก
<svg width="16" height="20" viewBox="0 0 16 20" aria-hidden="true" style="position: absolute; left: -14px; bottom: 12px"><path d="M15 2 L1 16 L15 12" fill="#ffffff" stroke="#000000" stroke-width="3" stroke-linejoin="round"></path></svg>
</div>
</div>
<button type="button" style="height: 56px; border: 3px solid #000000; border-radius: 12px; background: #000000; color: #ffffff; font-family: Kanit, sans-serif; font-weight: 800; font-size: 20px; box-shadow: 0 5px 0 #5a5a5a; cursor: pointer">ต่อไป</button>
</section>

</div>
</body>
</html>
